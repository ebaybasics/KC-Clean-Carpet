<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Standalone redirect interstitial: forwards to the Markate booking widget.
         Intentionally not linked from nav/footer and kept out of the index. -->
    <meta name="robots" content="noindex, follow">
    <title>Opening your booking calendar… | KC Clean Carpets</title>
    <link rel="icon" type="image/png" sizes="96x96" href="/brand_assets/favicon/favicon-96x96.png">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/brand_assets/favicon/apple-touch-icon.png">

    <!-- No-JS fallback: send the browser on after a short beat. -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://www.markate.com/public/widget/booking/products/7ef135c66c1c4f08932b8a16464ca1b8:30542:79c51231">
    </noscript>

    <link rel="preload" href="fonts/montserrat-900-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/montserrat-500-800-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/roboto-400-700-latin.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        @font-face {
            font-family: 'Montserrat';
            font-style: normal;
            font-weight: 400 800;
            font-display: fallback;
            src: url(fonts/montserrat-500-800-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Montserrat';
            font-style: normal;
            font-weight: 900;
            font-display: fallback;
            src: url(fonts/montserrat-900-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        @font-face {
            font-family: 'Roboto';
            font-style: normal;
            font-weight: 400 700;
            font-display: fallback;
            src: url(fonts/roboto-400-700-latin.woff2) format('woff2');
            unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
        }
        :root {
            --kc-blue: #1565C0;
            --kc-blue-dark: #0D47A1;
            --kc-navy: #0A2463;
            --kc-gold: #FFB300;
            --ink: #1a1a2e;
            --ink-soft: #4c5468;
        }
        *, *::before, *::after { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; min-height: 100%; }
        body {
            font-family: 'Roboto', sans-serif;
            color: var(--ink);
            /* Navy base, lifted by two off-center brand glows for depth. */
            background:
                radial-gradient(80% 90% at 15% 10%, rgba(21,101,192,0.35), transparent 60%),
                radial-gradient(70% 80% at 90% 90%, rgba(255,179,0,0.16), transparent 55%),
                var(--kc-navy);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 20px;
            padding: 44px 40px 40px;
            text-align: center;
            box-shadow:
                0 1px 0 rgba(255,255,255,0.6) inset,
                0 24px 60px -18px rgba(10,36,99,0.55),
                0 8px 22px -12px rgba(21,101,192,0.4);
        }
        .eyebrow {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 12px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--kc-blue);
            margin: 0 0 22px;
        }
        .eyebrow span { color: var(--kc-gold); }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 26px;
            line-height: 1.2;
            letter-spacing: -0.02em;
            color: var(--kc-navy);
            margin: 0 0 12px;
        }
        p.sub {
            font-size: 15.5px;
            line-height: 1.6;
            color: var(--ink-soft);
            margin: 0 0 28px;
        }
        /* Signature: a single gold sweep that reads as "getting your calendar". */
        .track {
            position: relative;
            height: 5px;
            border-radius: 999px;
            background: rgba(10,36,99,0.1);
            overflow: hidden;
            margin: 0 auto 30px;
            max-width: 220px;
        }
        .track::after {
            content: "";
            position: absolute;
            inset: 0;
            width: 40%;
            border-radius: 999px;
            background: linear-gradient(90deg, var(--kc-blue), var(--kc-gold));
            animation: sweep 1.15s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        @keyframes sweep {
            0%   { transform: translateX(-120%); }
            100% { transform: translateX(320%); }
        }
        .fallback {
            font-size: 14px;
            color: var(--ink-soft);
            margin: 0;
        }
        .fallback a {
            color: var(--kc-blue-dark);
            font-weight: 700;
            text-decoration: underline;
            text-underline-offset: 2px;
            border-radius: 4px;
            transition: color 140ms ease;
        }
        .fallback a:hover { color: var(--kc-blue); }
        .fallback a:focus-visible {
            outline: 3px solid var(--kc-gold);
            outline-offset: 3px;
        }
        @media (prefers-reduced-motion: reduce) {
            .track::after {
                animation: none;
                width: 100%;
                background: linear-gradient(90deg, var(--kc-blue), var(--kc-gold));
            }
        }
    </style>
</head>
<body>
    <main class="card">
        <p class="eyebrow">KC Clean <span>Carpets</span></p>
        <h1>Opening your booking calendar…</h1>
        <p class="sub">Pick a time that works for you — it only takes a moment.</p>
        <div class="track" role="progressbar" aria-label="Loading your booking calendar"></div>
        <p class="fallback">
            Not redirected automatically?
            <a id="book-link" href="https://www.markate.com/public/widget/booking/products/7ef135c66c1c4f08932b8a16464ca1b8:30542:79c51231">Open your booking calendar</a>.
        </p>
    </main>

    <script>
        (function () {
            var BOOKING_URL = 'https://www.markate.com/public/widget/booking/products/7ef135c66c1c4f08932b8a16464ca1b8:30542:79c51231';
            // replace() keeps /book out of history, so "back" from the widget
            // lands on the schedule form rather than re-triggering this redirect.
            window.location.replace(BOOKING_URL);
        })();
    </script>
</body>
</html>
